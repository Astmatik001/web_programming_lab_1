<!DOCTYPE html>
<html lang="en">
<head>
    <title>ProduceBuyShop - A Shop For Buying Produce</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header-container">
        <h1>ProduceBuyShop</h1>
        <button class="cart-button" id="cartButton">
            Cart
        </button>
    </header>
    <main>
        <section class="catalogue">
            <h2>Produce Catalogue</h2>
            <div class="produce-grid"></div>
        </section>
    </main>

    <div class="modal-overlay" id="cartModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Your Cart</h2>
                <button class="modal-close-button" id="closeCartButton">&times;</button>
            </div>
            <div class="modal-body">
                <section class="cart-items" id="cartItems">
                    <p class="empty-cart">The Cart Is Empty</p>
                </section>
                <div class="cart-total">
                    <strong>Total: <span id="cartTotal">0</span> $</strong>
                </div>
            </div>
            <div class="modal-footer">
                <button class="checkout-button" id="checkoutButton">Checkout</button>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Checkout</h2>
                <button class="modal-close" id="closeOrderModal">&times;</button>
            </div>
            <div class="modal-body">
                <form class="order-form" id="orderForm">
                    <div class="form-group">
                        <label for="firstName">Name *</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Surname *</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Shiping address *</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone number *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <button type="submit" class="submit-order-button">Create order</button>
                </form>
                <div class="order-success" id="orderSuccess" style="display: none;">
                    <p>Order created!</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 ProduceBuyShop. No rights protected.</p>
    </footer>
    <script src="script.js" defer></script>
</body>
</html>
